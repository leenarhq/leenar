name       = "leenar-api"
main       = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Non-secret runtime config. Fill these in for your deployment. In production
# these MUST be set here (or as secrets) — `.dev.vars` only applies to `wrangler dev`.
[vars]
SUPABASE_URL        = ""                       # https://<your-project-ref>.supabase.co
FRONTEND_URL        = "http://localhost:5173"  # your web app origin
API_URL             = "http://localhost:8787"  # this worker's public origin
ADMIN_EMAIL         = ""                        # admin@example.com
SENTRY_ENVIRONMENT  = "development"

# Optional. CORS browser-origin allowlist (comma-separated). Defaults to
# FRONTEND_URL when unset, so a single-origin install needs nothing here.
# CORS_ALLOWED_ORIGINS = "https://app.example.com,https://www.app.example.com"

# Optional. Attribution stamped into users' deployed repos (marker commit +
# GitHub Deployment record). Defaults to generic, FRONTEND_URL-derived values.
# DEPLOY_BRAND_NAME   = "Acme"
# DEPLOY_BRAND_URL    = "https://app.example.com"
# DEPLOY_COMMIT_EMAIL = "deploy@example.com"

# Secrets (set with: wrangler secret put <NAME>) — never commit these:
#   SUPABASE_JWT_SECRET, SUPABASE_SERVICE_ROLE_KEY, ENCRYPTION_KEY,
#   INTERNAL_SECRET, STATE_SIGNING_SECRET, OPENAI_API_KEY,
#   GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY, GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET,
#   VERCEL_CLIENT_ID, VERCEL_CLIENT_SECRET, SUPABASE_CLIENT_ID, SUPABASE_CLIENT_SECRET,
#   RESEND_API_KEY, RESEND_FROM

[observability]
enabled = true

[[durable_objects.bindings]]
name       = "PROVISIONER"
class_name = "ProvisionerDO"

[[migrations]]
tag                = "v1"
new_sqlite_classes = ["ProvisionerDO"]

[placement]
mode = "smart"
