# Blocks a pull request until its author has signed the CLA.
#
# Leenar Core is AGPL-3.0-only and is built from the same tree as the closed
# Leenar Cloud. Without a relicensing grant, back-porting a contribution into
# that tree would oblige the cloud service to publish its own source. The CLA is
# what makes accepting pull requests possible at all.
#
# Signatures are stored in a SEPARATE repository on purpose. This repo's tree is
# overwritten wholesale by each upstream sync, so a signature file committed here
# would be deleted by the next sync — and would trip the sync's clobber guard on
# the way out.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/leenarhq/leenar/blob/main/CLA.md
          branch: main
          allowlist: mahmutefedara,dependabot[bot]
          remote-organization-name: leenarhq
          remote-repository-name: cla-signatures
          custom-notsigned-prcomment: >
            Thanks for the pull request. Leenar Core is AGPL-3.0-only and is built
            from the same source tree as Leenar Cloud, so we need a relicensing
            grant before a contribution can be merged. Please read the
            [CLA](https://github.com/leenarhq/leenar/blob/main/CLA.md) and comment:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
